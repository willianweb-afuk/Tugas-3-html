<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 3 - Aritmatika</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            width: 450px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #123b2a;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            font-size: 18px;
            cursor: pointer;
            border: 1px solid #999;
            border-radius: 5px;
            background-color: #f8f8f8;
        }

        button:hover {
            background-color: #ddd;
        }

        .output {
            margin-top: 20px;
        }

        .output input {
            background-color: #f5f5f5;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Kalkulator Aritmatika</h1>

        <label for="bilangan1">Input Bilangan 1</label>
        <input type="number" id="bilangan1" value="9">

        <label for="bilangan2">Input Bilangan 2</label>
        <input type="number" id="bilangan2" value="3">

        <div class="buttons">
            <button onclick="hitung('+')">+</button>
            <button onclick="hitung('-')">-</button>
            <button onclick="hitung('*')">×</button>
            <button onclick="hitung('/')">/</button>
        </div>

        <div class="output">
            <label for="hasil">Output</label>
            <input type="text" id="hasil" readonly>
        </div>

    </div>


    <script>
        function hitung(operator) {

            // Mengambil nilai dari input
            let bilangan1 = Number(document.getElementById("bilangan1").value);
            let bilangan2 = Number(document.getElementById("bilangan2").value);

            let hasil;

            // Proses perhitungan
            if (operator === "+") {
                hasil = bilangan1 + bilangan2;
            } 
            else if (operator === "-") {
                hasil = bilangan1 - bilangan2;
            } 
            else if (operator === "*") {
                hasil = bilangan1 * bilangan2;
            } 
            else if (operator === "/") {

                if (bilangan2 === 0) {
                    hasil = "Tidak dapat dibagi 0";
                } else {
                    hasil = bilangan1 / bilangan2;
                }
            }

            // Menampilkan hasil
            document.getElementById("hasil").value = hasil;
        }
    </script>

</body>
</html>
